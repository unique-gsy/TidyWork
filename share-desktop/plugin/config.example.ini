# TidyWorky 邮箱模块 - 配置模板
#
# 使用方法：
#   1. 把本文件复制一份，命名为 config.ini（与本文件放在同一目录）；
#   2. 填入你的 QQ 邮箱地址和 16 位授权码；
#   3. config.ini 已被 .gitignore 忽略，请勿把它发给任何人。
#
# 授权码不是 QQ 登录密码！获取方式：
#   QQ 邮箱网页版 -> 顶部「设置」->「账户」->
#   找到「POP3/IMAP/SMTP/Exchange/CardDAV/CalDAV服务」->
#   开启「IMAP/SMTP 服务」（B 阶段日程再开启 CardDAV/CalDAV）->
#   按提示用手机发短信验证，生成 16 位授权码，复制到下面 auth_code。

[account]
# 完整 QQ 邮箱地址，例如 123456@qq.com
email = your_name@qq.com
# 16 位授权码（不是登录密码）
auth_code = your_16_char_auth_code
# 发件人显示名（可留空，留空则使用 @ 前面的账号名）
display_name =

[imap]
host = imap.qq.com
port = 993
# true 表示使用 SSL（QQ 邮箱 993 端口固定为 SSL）
ssl = true

[smtp]
host = smtp.qq.com
port = 465
# 465 端口为隐式 SSL；如改用 587 请把 ssl 改为 false 并走 STARTTLS
ssl = true

[caldav]
# 日程提醒（B 阶段）。需要先在 QQ 邮箱网页版开启 CalDAV 服务（与 IMAP 同一授权码）。
# 客户端会自动从 /.well-known/caldav 发现日历根路径（实际为 /calendar/），无需手动填。
enabled = false
url = https://dav.qq.com/

[carddav]
# 联系人（CardDAV 通讯录），A 阶段可选，B 阶段使用
enabled = false
url = https://dav.qq.com/

[storage]
# 附件下载目录；留空则使用「技能包目录/downloads」
download_dir =
# 本地联系人缓存（lookup-recipient 从历史邮件提取）
contact_cache =
