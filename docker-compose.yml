# ============================================================================
# TidyWork AI 助手 · 一键部署（OrbStack / Docker 通用）
#
# 用法：在本文件所在目录执行
#   cp .env.example .env        # 首次：生成环境配置
#   vim .env                    # 填入 DEEPSEEK_API_KEY
#   docker compose up -d --build
# 访问：http://localhost:3080（地址含 token，见 data/context/dsh-web-url.txt）
#
# 数据（默认 ./data，可整体改位置）：
#   data/dsh/        DSH 数据目录（workspace/sessions/skills + 工作区业务数据），容器重建不丢
#   data/context/    你的个人上下文（可选，放 context.md 助手每次回答都会参考）
#
# 分享给他人：把整个项目（含 docker-compose.yml）推到 GitHub，
# 对方 clone 后同样 `cp .env.example .env && docker compose up -d --build` 即可。
# ============================================================================

name: tidywork-assistant

services:
  assistant:
    build:
      context: .
      dockerfile: dsh/Dockerfile
    image: tidywork-assistant:latest
    container_name: tidywork-assistant
    restart: unless-stopped
    ports:
      # DSH Web（工作台 + 原生对话；启动后读 data/context/dsh-web-url.txt 取带 token 地址）
      - "${DSH_WEB_PORT:-3080}:3080"
    environment:
      # DSH 使用的 DeepSeek API Key（必填，DSH provider 默认读取此变量）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # 容器时区：工作区时间戳（笔记 updatedAt、待办截止等）按本地时区生成
      - TZ=${TZ:-Asia/Shanghai}
      # 宿主机映射端口，入口脚本据此写出正确的访问地址（改端口时不必改脚本）
      - DSH_HOST_PORT=${DSH_WEB_PORT:-3080}
    volumes:
      # DSH 数据持久化（workspace/sessions/skills + 工作区业务数据），默认 ./data/dsh
      - ${TIDYWORK_DATA_DIR:-./data}/dsh:/root/.dsh
      # 个人上下文目录（context.md），默认 ./data/context
      - ${TIDYWORK_DATA_DIR:-./data}/context:/data
